name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  rust-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libglib2.0-dev libasound2-dev \
            libvulkan-dev glslc
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libglib2.0-dev libasound2-dev \
            libvulkan-dev glslc
      - name: Force static CRT for CMake builds on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $toolchain = "$env:RUNNER_TEMP\static-crt.cmake"
          @"
          # Force whisper-rs-sys (whisper.cpp) to use /MT (static CRT) instead of
          # /MD (dynamic CRT) so it matches sherpa-onnx-sys's prebuilt Windows
          # binaries, which ship compiled with /MT. Without this, the MSVC linker
          # errors out with LNK2038 RuntimeLibrary mismatch.
          #
          # CMake >= 3.15 passes this variable through to MSVC as the /MT flag.
          set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded" CACHE STRING "Use static CRT (/MT)")
          "@ | Out-File -FilePath $toolchain -Encoding ASCII
          echo "CMAKE_TOOLCHAIN_FILE=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: Swatinem/rust-cache@v2
        # Force a cache miss on Windows so whisper-rs-sys re-runs its cmake build
        # with the static-CRT toolchain file above. The cache key suffix ensures
        # this run doesn't restore old artifacts compiled with /MD.
        with:
          key: ${{ matrix.os == 'windows-latest' && 'static-crt-v1' || '' }}
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --lib --bins

  rust-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  frontend:
    name: frontend lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
