name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].R*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: linux-x64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, runner: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Write release version
        run: echo "${{ github.ref_name }}" > VERSION

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Tauri Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libglib2.0-dev libasound2-dev \
            libvulkan-dev glslc

      - name: Force static CRT for MSVC compilations on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "_CL_=/MT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ASCII

      - name: Set up MSVC dev command prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Rename Git link.exe to prevent MSVC linker conflict (Windows)
        # The Git for Windows installation has a link.exe file in its usr/bin
        # directory. This file is the GNU coreutils link command. It creates
        # hard links. The MSVC linker, also named link.exe, is part of Visual
        # Studio. When the Rust compiler searches for a linker, it can find the
        # Git file before the MSVC file. This causes the build to fail.
        # Rename the Git file to remove it from the search path. The MSVC
        # linker is the only link.exe available after this change.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitLink = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $gitLink) {
            Rename-Item -Path $gitLink -NewName "link.exe.bak" -Force
          }

      - name: Force NMake generator for CMake on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "CMAKE_GENERATOR=NMake Makefiles" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ASCII

      - name: Build meety-mcp sidecar
        shell: bash
        run: |
          cargo build --release -p meety-mcp
          mkdir -p src-tauri/binaries
          cp "target/release/meety-mcp" \
             "src-tauri/binaries/meety-mcp-${{ matrix.platform.target }}" || true

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for the entries that landed in this release.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}

      - name: Build Tauri app (Linux + Windows)
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for the entries that landed in this release.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}
