name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: linux-x64,   runner: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, runner: windows-latest,  target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build meety-mcp sidecar
        shell: bash
        run: |
          cargo build --release -p meety-mcp --target ${{ matrix.platform.target }}
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.platform.target }}/release/meety-mcp" \
             "src-tauri/binaries/meety-mcp-${{ matrix.platform.target }}" || true

      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for the entries that landed in this release.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.platform.target }}

      - name: Build Tauri app (Linux + Windows)
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for the entries that landed in this release.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.platform.target }}