name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].R*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macos-arm64, runner: macos-26, target: aarch64-apple-darwin }
          - { name: linux-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x64, runner: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Write release version
        run: echo "${{ github.ref_name }}" > VERSION

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.platform.target }}

      - name: Install Tauri Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libglib2.0-dev libasound2-dev \
            libvulkan-dev glslc

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" | Select-Object -Last 1 -ExpandProperty Name
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib\10.*" | Select-Object -Last 1 -ExpandProperty Name
          $vctools = "$vs\VC\Tools\MSVC\$msvc"
          echo "VCToolsInstallDir=$vctools\" >> $env:GITHUB_ENV
          echo "PATH=$vctools\bin\Hostx64\x64;$env:PATH" >> $env:GITHUB_ENV
          echo "LIB=$vctools\lib\x64;C:\Program Files (x86)\Windows Kits\10\Lib\$sdk\ucrt\x64;C:\Program Files (x86)\Windows Kits\10\Lib\$sdk\um\x64" >> $env:GITHUB_ENV
          echo "INCLUDE=$vctools\include;C:\Program Files (x86)\Windows Kits\10\Include\$sdk\ucrt;C:\Program Files (x86)\Windows Kits\10\Include\$sdk\um;C:\Program Files (x86)\Windows Kits\10\Include\$sdk\shared" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$vctools\bin\Hostx64\x64\link.exe" >> $env:GITHUB_ENV
      - name: Force static CRT via Rust target feature (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "RUSTFLAGS=-Ctarget-feature=+crt-static" >> $env:GITHUB_ENV

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Build meety-mcp sidecar
        shell: bash
        run: |
          cargo build --release -p meety-mcp
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/release/meety-mcp.exe" \
               "src-tauri/binaries/meety-mcp-${{ matrix.platform.target }}"
          else
            cp "target/release/meety-mcp" \
               "src-tauri/binaries/meety-mcp-${{ matrix.platform.target }}"
          fi

      - name: Build Tauri app
        shell: bash
        run: |
          TARGET="${{ matrix.platform.target }}"

          # Build the Tauri app (bundles into dmg/deb/rpm/msi).
          # Uses `bun run tauri` (resolves @tauri-apps/cli devDependency).
          # The version in tauri.conf.json (0.1.0) is left as-is — Tauri
          # requires it to be valid semver. Bundle files are renamed with
          # the release tag in the next step.
          bun run tauri build --target "$TARGET"

      - name: Rename bundles with tag- and platform-qualified names
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TARGET="${{ matrix.platform.target }}"

          # Map Rust target triple → user-facing platform label
          case "$TARGET" in
            aarch64-apple-darwin)     PLAT="macos-arm64"  ;;
            x86_64-unknown-linux-gnu) PLAT="linux-x64"    ;;
            x86_64-pc-windows-msvc)   PLAT="windows-x64"  ;;
          esac

          BUNDLE_DIR="target/${TARGET}/release/bundle"
          echo "=== Bundle directory contents (before rename) ==="
          find "$BUNDLE_DIR" -type f

          for dir in "$BUNDLE_DIR"/*/; do
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              ext="${f##*.}"
              new_name="Meety-${TAG}-${PLAT}.${ext}"
              if [ "$f" != "${dir}${new_name}" ]; then
                mv "$f" "${dir}${new_name}"
                echo "::notice title=Artifact::Meety-${TAG}-${PLAT}.${ext}"
              fi
            done
          done

          echo "=== Bundle directory contents (after rename) ==="
          find "$BUNDLE_DIR" -type f

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          TARGET="${{ matrix.platform.target }}"
          BUNDLE_DIR="target/${TARGET}/release/bundle"

          # Create a draft release if this is the first job to get here.
          # --clobber on upload makes subsequent jobs overwrite safely.
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes "See CHANGELOG.md for the entries that landed in this release." \
            || true

          # Upload every Meety-* bundle artifact from this platform.
          find "$BUNDLE_DIR" -name "Meety-*" -type f -print0 | \
            xargs -0 gh release upload "$TAG" --clobber
