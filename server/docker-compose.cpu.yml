services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MEETY_DATABASE_URL: sqlite+aiosqlite:////data/meety.db
      FOLIO_STORAGE_DIR: /data/blobs
    ports:
      - "8080:8080"
    volumes:
      - meety-data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.cpu
    env_file: .env
    environment:
      MEETY_DATABASE_URL: sqlite+aiosqlite:////data/meety.db
      FOLIO_STORAGE_DIR: /data/blobs
      MEETY_WHISPER_DEVICE: cpu
      MEETY_WHISPER_COMPUTE_TYPE: int8
    volumes:
      - meety-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  meety-data:
