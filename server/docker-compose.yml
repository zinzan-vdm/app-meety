services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_FQDN_API_8080
      - MEETY_JWT_SECRET=${SERVICE_BASE64_64_JWT}
      - MEETY_DATABASE_URL=sqlite+aiosqlite:////data/meety.db
      - MEETY_STORAGE_DIR=/data/blobs
      - MEETY_ENVIRONMENT=production
      - MEETY_ALLOW_REGISTRATION=${MEETY_ALLOW_REGISTRATION:-true}
      - MEETY_WHISPER_MODEL=${MEETY_WHISPER_MODEL:-base}
      - MEETY_MAX_UPLOAD_BYTES=${MEETY_MAX_UPLOAD_BYTES:-2147483648}
    volumes:
      - meety-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - MEETY_JWT_SECRET=${SERVICE_BASE64_64_JWT}
      - MEETY_DATABASE_URL=sqlite+aiosqlite:////data/meety.db
      - MEETY_STORAGE_DIR=/data/blobs
      - MEETY_WHISPER_DEVICE=cuda
      - MEETY_WHISPER_COMPUTE_TYPE=${MEETY_WHISPER_COMPUTE_TYPE:-float16}
      - MEETY_WHISPER_MODEL=${MEETY_WHISPER_MODEL:-base}
    volumes:
      - meety-data:/data
    depends_on:
      - api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  meety-data:
